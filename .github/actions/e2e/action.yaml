name: E2E
author: EnricoMi
description: Github Action to run end-to-end tests against a Spark and Scala version

inputs:
  spark_version:
    description: Spark version to build against, e.g. "3.5.5"
    required: true
  scala_version:
    description: Scala version to build with, e.g. "2.13.8"
    required: true
  java_version:
    description: Java version to build with, e.g. "11"
    required: true

runs:
  using: composite
  steps:
  - name: Checkout
    uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    with:
      path: armada-spark

  - name: Restore Maven packages cache
    uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
    with:
      path: ~/.m2/repository
      key: ${{ runner.os }}-mvn-e2e-${{ inputs.spark_version }}-${{ inputs.scala_version }}-${{ hashFiles('armada-spark/pom.xml') }}
      restore-keys: |
        ${{ runner.os }}-mvn-e2e-${{ inputs.spark_version }}-${{ inputs.scala_version }}-${{ hashFiles('armada-spark/pom.xml') }}
        ${{ runner.os }}-mvn-e2e-${{ inputs.spark_version }}-${{ inputs.scala_version }}-

  - name: Move docker
    run: |
      # Moving docker to save space and preventing auto-restart
      echo "::group::moving Docker"
      df -h /mnt
      sudo systemctl stop docker.socket docker.service
      sudo mv /var/lib/docker /mnt/docker
      sudo ln -s /mnt/docker /var/lib/docker
      sudo systemctl start docker
      df -h /mnt
      echo "::endgroup::"
    shell: bash
  - name: Setup JDK
    uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
    with:
      java-version: ${{ inputs.java_version }}
      distribution: 'zulu'
  # Inlined from armadaproject/armada-operator's setup-go-cache composite action:
  # that action calls actions/setup-go@v5 and actions/cache@v3 without pinning
  # them to a commit SHA, which armada-spark's CI policy requires of every
  # action, including ones nested inside third-party composite actions.
  - name: Setup Go
    id: setup-go
    uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
    with:
      go-version: '1.22'
      check-latest: true
      cache: false
  - name: Determine Go cache path
    id: cache-info
    shell: bash
    run: echo path=$(go env GOCACHE) >> "$GITHUB_OUTPUT"
  - name: Restore Go build cache
    uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
    with:
      path: ${{ steps.cache-info.outputs.path }}
      key: go-e2e-go-${{ steps.setup-go.outputs.go-version }}-mod-${{ hashFiles('go.sum') }}

  - name: Set environment
    working-directory: armada-spark
    run: |
      echo "SPARK_VERSION=${{ inputs.spark_version }}" >> $GITHUB_ENV
      echo "SCALA_VERSION=${{ inputs.scala_version }}" >> $GITHUB_ENV
      echo "DEPLOY_MODE=client" >> $GITHUB_ENV
    shell: bash

  - name: Build package
    working-directory: armada-spark
    run: |
      # Build package
      echo "::group::mvn package"
      source ./scripts/init.sh
      mvn --batch-mode clean package -P$MAVEN_PROFILES
      echo "::endgroup::"
    shell: bash

  - name: Build image
    working-directory: armada-spark
    env:
      JAVA_VERSION: ${{ inputs.java_version }}
    run: |
      # Build image
      echo "::group::createImage.sh"
      ./scripts/createImage.sh -p -e
      echo "::endgroup::"
    shell: bash

  - name: Test job processing
    id: submit
    working-directory: armada-spark
    run: |
      echo "::group::dev-e2e.py"
      python3 ./armada-spark/scripts/dev-e2e.py
      echo "::endgroup::"
    shell: bash
    